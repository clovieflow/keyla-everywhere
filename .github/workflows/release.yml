name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run dashboard:build
      - run: cargo build --release --locked -p keyla-cli --bin keyla
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/keyla "keyla-${{ matrix.platform }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "keyla-${{ matrix.platform }}" > "keyla-${{ matrix.platform }}.sha256"
          else
            shasum -a 256 "keyla-${{ matrix.platform }}" > "keyla-${{ matrix.platform }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: keyla-${{ matrix.platform }}
          path: |
            keyla-${{ matrix.platform }}
            keyla-${{ matrix.platform }}.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
