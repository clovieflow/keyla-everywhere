services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: keyla-everywhere:local
    ports:
      - "127.0.0.1:${PORT:-12800}:12800"
    # Keep credentials and URLs in .env; do not bake database secrets into
    # this application stack. PostgreSQL is external. Redis is bundled for
    # shared admission; clear REDIS_URL for the in-memory backend.
    env_file:
      - "${KEYLA_ENV_FILE:-../.env}"
    environment:
      PORT: "12800"
      KEYLA_BIND_HOST: "0.0.0.0"
      KEYLA_DATA_DIR: /app/data
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
    depends_on:
      - redis
    volumes:
      # Install id, pid/log, and payload captures live under /app/data;
      # without this mount a container replace wipes them.
      - keyla-data:/app/data
    restart: unless-stopped
    networks:
      - keyla

  # Redis is bundled for Docker's default full capabilities. Compose allows
  # REDIS_URL to be overridden/emptied for the in-memory backend. PostgreSQL is
  # never bundled; full mode reaches it through DATABASE_URL in .env.
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - keyla

volumes:
  redisdata:
  keyla-data:

networks:
  keyla:
    driver: bridge
