[package]
name = "keyla-security"
description = "Credential crypto, API-key authentication, scopes, and model access"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
chrono = "0.4"
base64.workspace = true
keyla-config = { path = "../keyla-config" }
keyla-core = { path = "../keyla-core" }
hmac = "0.12"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid", "macros"] }
thiserror = "2"

[dev-dependencies]
postgresql_embedded = { version = "0.22", features = ["blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "net"] }
keyla-db = { path = "../keyla-db" }
